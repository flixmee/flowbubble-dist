<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlowBubble playground</title>
  <link rel="stylesheet" href="example.css">
</head>
<body>
  <main class="wide">
    <h1 data-i18n="heading">FlowBubble playground</h1>
    <p class="lead" data-i18n-html="lead"></p>

    <div class="playground">
      <form class="options card" id="options" autocomplete="off">
        <fieldset>
          <legend data-i18n="language">Language</legend>
          <div class="field">
            <div class="seg" role="radiogroup" aria-labelledby="l-lang">
              <label><input type="radio" name="lang" value="auto"><span data-i18n="auto">Auto</span></label>
              <label><input type="radio" name="lang" value="en"><span lang="en">English</span></label>
              <label><input type="radio" name="lang" value="vi"><span lang="vi">Tiếng Việt</span></label>
            </div>
            <small id="l-lang" data-i18n="languageHint"></small>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="text">Text</legend>
          <label class="field"><span data-i18n="title">Title</span><input type="text" name="title" maxlength="60"></label>
          <label class="field"><span data-i18n="subtitle">Subtitle</span><input type="text" name="subtitle" maxlength="80"></label>
          <label class="field"><span data-i18n="greeting">Greeting</span><textarea name="greeting" rows="2"></textarea>
            <small data-i18n="greetingHint"></small></label>
          <label class="field"><span data-i18n="placeholder">Input placeholder</span><input type="text" name="placeholder" maxlength="80"></label>
          <label class="field"><span data-i18n="suggestions">Suggestions</span><input type="text" name="suggestions">
            <small data-i18n-html="suggestionsHint"></small></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="look">Look</legend>
          <div class="field">
            <label class="label" for="accent-text" data-i18n="accent">Accent color</label>
            <div class="color">
              <input type="color" id="accent-color" data-i18n-aria="accentPick">
              <input type="text" id="accent-text" name="accent" maxlength="7" spellcheck="false">
            </div>
          </div>
          <div class="field">
            <span class="label" id="l-position" data-i18n="position">Position</span>
            <div class="seg" role="radiogroup" aria-labelledby="l-position">
              <label><input type="radio" name="position" value="left"><span data-i18n="left">Left</span></label>
              <label><input type="radio" name="position" value="right"><span data-i18n="right">Right</span></label>
            </div>
          </div>
          <div class="field">
            <span class="label" id="l-theme" data-i18n="theme">Theme</span>
            <div class="seg" role="radiogroup" aria-labelledby="l-theme">
              <label><input type="radio" name="theme" value="auto"><span data-i18n="auto">Auto</span></label>
              <label><input type="radio" name="theme" value="light"><span data-i18n="light">Light</span></label>
              <label><input type="radio" name="theme" value="dark"><span data-i18n="dark">Dark</span></label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="behavior">Behavior</legend>
          <label class="check"><input type="checkbox" name="open"> <span data-i18n="open">Open the panel on load</span></label>
          <label class="check"><input type="checkbox" name="typewriter"> <span data-i18n="typewriter">Typewriter reveal of replies</span></label>
          <label class="check"><input type="checkbox" name="guestForm"> <span data-i18n="guestForm">Require the guest form before chatting</span></label>
          <label class="field" id="consent-field" hidden><span data-i18n="consentText">Consent text</span><textarea name="consentText" rows="3"></textarea></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="backend">Backend</legend>
          <label class="field"><span data-i18n="webhook">Webhook URL</span><input type="url" name="webhook" spellcheck="false">
            <small id="webhook-hint"></small></label>
          <label class="field"><span data-i18n="contentType">Content type</span>
            <select name="contentType">
              <option value="json" data-i18n="contentJson">json (application/json)</option>
              <option value="text" data-i18n="contentText">text (text/plain, no CORS preflight)</option>
            </select></label>
        </fieldset>

        <div class="buttons">
          <button type="button" id="reset-options" data-i18n="reset">Reset options</button>
        </div>
      </form>

      <div class="side">
        <h2 data-i18n="embedCode">Embed code</h2>
        <div class="code-head">
          <div class="tabs" role="tablist" data-i18n-aria="embedStyle">
            <button type="button" role="tab" id="tab-js" aria-selected="true" aria-controls="code">JavaScript</button>
            <button type="button" role="tab" id="tab-tag" aria-selected="false" aria-controls="code" data-i18n="tabTag">Script tag</button>
          </div>
          <button type="button" class="copy" id="copy" data-i18n="copy">Copy</button>
        </div>
        <pre id="code" role="tabpanel" tabindex="0"></pre>
        <p class="lead note" data-i18n-html="codeNote"></p>

        <h2 data-i18n="tryTitle">Things to try</h2>
        <p data-i18n-html="tryText"></p>

        <h2 data-i18n="apiTitle">JavaScript API</h2>
        <div class="buttons" id="api">
          <button type="button" data-api="open">open()</button>
          <button type="button" data-api="close">close()</button>
          <button type="button" data-api="toggle">toggle()</button>
          <button type="button" data-api="send">send(…)</button>
          <button type="button" data-api="reset">reset()</button>
        </div>
        <p data-i18n-html="eventsLabel"></p>
        <pre id="events"></pre>
      </div>
    </div>
  </main>

  <!-- Example only: answers the widget in the browser. Don't copy this to your site. -->
  <script src="mock-backend.js"></script>
  <script src="event-log.js"></script>
  <!-- Builds the form, the embed code and loads the widget with document.createElement('script'). -->
  <script src="playground.js"></script>
</body>
</html>
